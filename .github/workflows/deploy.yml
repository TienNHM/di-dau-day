name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; queued runs supersede rather than cancel, so a
# push never leaves the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://didauday.tiennhm.io.vn
      # Custom domain serves at root, so no basePath.
      NEXT_PUBLIC_BASE_PATH: ''
      # Umami is cookie-less and the website id is public in the page source
      # anyway, so it lives here rather than in a secret.
      NEXT_PUBLIC_UMAMI_SRC: https://cloud.umami.is/script.js
      NEXT_PUBLIC_UMAMI_ID: 0f04de33-e4ca-4000-841f-a65afcde9f6f
      # Contribution form. Empty would fall back to a GitHub issue link rather than
      # break, but the Worker is deployed, so point at it.
      # See workers/contribute/README.md.
      NEXT_PUBLIC_CONTRIBUTE_ENDPOINT: https://didauday-contribute.tiennhm-it.workers.dev
      # Site key is public — it ships in the page source. The matching secret
      # lives only as a Worker secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAExbnWCiRLmr49vP
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail the deploy on a type error, lint error or failing test rather
      # than publishing a broken site.
      - run: pnpm check

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
